<!doctype html>
<html lang="zh" data-theme="tokyo-night">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>Skill History — Agent Skills 演化时间轴</title>
<style>
__THEME_CSS__
:root{--font-ui:-apple-system,'PingFang SC','Segoe UI',Roboto,sans-serif;
      --font-mono:'SF Mono',ui-monospace,Menlo,Consolas,'JetBrains Mono',monospace;}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font:14px/1.5 var(--font-ui);min-height:100vh}
a{color:var(--blue);text-decoration:none}a:hover{text-decoration:underline}
button{font-family:var(--font-ui)}
.hidden{display:none !important}
/* 顶栏 */
.topbar{display:flex;justify-content:space-between;align-items:center;padding:12px 24px;
        border-bottom:1px solid var(--dimline)}
.brand{display:flex;gap:9px;align-items:center;font-weight:600;font-size:14px;color:var(--text)}
.topright{display:flex;gap:10px;align-items:center}
.lang{display:flex;gap:2px;padding:3px;background:var(--panel2);border-radius:7px}
.lang button{border:0;background:none;padding:3px 9px;border-radius:5px;font-size:11.5px;color:var(--faint);cursor:pointer}
.lang button.on{background:var(--panel);color:var(--text)}
.theme-sel{background:var(--panel2);color:var(--dim);border:1px solid var(--line);border-radius:7px;
           padding:4px 8px;font-size:11.5px;cursor:pointer;outline:none}
/* 控制台:槽位 = skill @ 时间点 */
.console{position:relative;display:flex;gap:14px;align-items:center;padding:16px 24px 12px}
.slot{position:relative;flex:1;display:flex;align-items:center;gap:11px;height:52px;padding:0 15px;
      background:var(--blue-soft);border:2px solid var(--blue);border-radius:12px;cursor:pointer;min-width:0}
.slot[data-side="B"]{background:var(--purple-soft);border-color:var(--purple-ring)}
.slot .badge{width:25px;height:25px;border-radius:13px;background:var(--panel2);color:var(--blue);
             display:flex;align-items:center;justify-content:center;
             font-family:var(--font-mono);font-size:12px;font-weight:600;flex:none}
.slot[data-side="B"] .badge{color:var(--purple)}
.slot .slot-icon{flex:none}
.slot[data-side="A"] .slot-icon,.slot[data-side="A"] .chev{color:var(--blue)}
.slot[data-side="B"] .slot-icon,.slot[data-side="B"] .chev{color:var(--purple)}
.slot .name{font-family:var(--font-mono);font-size:14px;font-weight:600;color:var(--text);
            white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot .timechip{display:inline-flex;gap:4px;align-items:center;flex:none;
                font-family:var(--font-mono);font-size:10.5px;color:var(--dim);
                background:var(--panel2);padding:2px 8px;border-radius:999px}
.slot .warn{flex:none;padding:3px 8px;border-radius:6px;background:var(--orange-bg);
            color:var(--orange);font-size:10.5px}
.slot .spacer{flex:1}
.swap{flex:none;width:42px;height:42px;border-radius:21px;background:var(--panel2);
      border:1px solid var(--line);display:flex;align-items:center;justify-content:center;cursor:pointer}
.swap:hover{border-color:var(--blue)}
/* 选择面板 */
.picker{position:absolute;top:calc(100% + 8px);left:0;right:0;z-index:60;
        background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;
        box-shadow:0 12px 36px #000000a0;max-height:520px;overflow-y:auto}
.picker .sec{padding:12px 14px 8px}
.picker .sec-label{font-size:10.5px;color:var(--faint);letter-spacing:1px;padding-bottom:6px;
                   display:flex;gap:5px;align-items:center}
.picker .feat{display:flex;gap:8px;align-items:center;padding:8px 10px;border-radius:8px;cursor:pointer}
.picker .feat:hover{background:var(--panel2)}
.picker .feat .t{font-family:var(--font-mono);font-size:12px;color:var(--plain);flex:1}
.picker .divider{height:1px;background:var(--line)}
.picker .row{display:flex;gap:8px;align-items:center;padding:8px 10px;border-radius:8px;cursor:pointer}
.picker .row:hover,.picker .row.sel{background:var(--panel2)}
.picker .row .selbar{width:2px;height:18px;border-radius:1px;background:var(--blue);flex:none}
.picker .row .nm{font-family:var(--font-mono);font-size:12.5px;color:var(--text)}
.picker .row .spacer{flex:1}
.picker .row .meta{font-family:var(--font-mono);font-size:10.5px;color:var(--faint);white-space:nowrap}
.picker .empty{padding:18px;color:var(--faint);font-size:12.5px;text-align:center}
.lic-badge{padding:2px 7px;border-radius:5px;font-size:10.5px;flex:none}
.lic-badge.full{background:var(--green-bg);color:var(--green)}
.lic-badge.deg{background:var(--orange-bg);color:var(--orange)}
/* 版本模式 */
.mode-row{display:flex;justify-content:space-between;align-items:center;padding:16px 24px 0}
.mode-left{display:flex;gap:8px;align-items:center}
.mode-pill{padding:4px 12px;border-radius:999px;background:var(--blue-soft);
           border:1px solid var(--blue);color:var(--blue);font-size:12px;font-weight:600}
.mode-name{font-family:var(--font-mono);font-size:14px;font-weight:600;color:var(--text)}
.mode-count{font-size:11.5px;color:var(--faint)}
.timeline{padding:4px 34px 0}
.t-flags{display:flex;align-items:flex-end}
.t-flags .flag{display:flex;gap:4px;padding:3px 9px;border-radius:999px;align-items:center;
               font-family:var(--font-mono);font-size:10.5px}
.t-flag-a{background:var(--blue-soft);color:var(--blue)}
.t-flag-b{background:var(--purple-soft);color:var(--purple)}
.t-slider{position:relative;height:28px;margin:0 6px}
.t-slider .t-line{position:absolute;left:0;right:0;top:13px;height:2px;background:var(--line)}
.t-star{position:absolute;top:-6px;transform:translateX(-50%);color:var(--orange);
        font-size:10px;pointer-events:none}
.t-slider input[type=range]{position:absolute;left:0;width:100%;top:5px;height:18px;margin:0;
  -webkit-appearance:none;appearance:none;background:none;pointer-events:none;outline:none}
.t-slider input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;pointer-events:auto;
  width:16px;height:16px;border-radius:9px;cursor:grab;border:2px solid var(--bg)}
.t-slider input[type=range]::-moz-range-thumb{pointer-events:auto;width:14px;height:14px;
  border-radius:8px;cursor:grab;border:2px solid var(--bg)}
.t-slider input.ts-a::-webkit-slider-thumb{background:var(--blue)}
.t-slider input.ts-b::-webkit-slider-thumb{background:var(--purple)}
.t-slider input.ts-a::-moz-range-thumb{background:var(--blue)}
.t-slider input.ts-b::-moz-range-thumb{background:var(--purple)}
.t-slider input.ts-a:active::-webkit-slider-thumb,.t-slider input.ts-b:active::-webkit-slider-thumb{cursor:grabbing}
.t-bubble{position:absolute;top:-30px;transform:translateX(-50%);opacity:0;pointer-events:none;
          transition:opacity .12s;white-space:pre;text-align:center;
          font-family:var(--font-mono);font-size:10px;line-height:1.5;
          background:var(--panel2);border:1px solid var(--line);border-radius:7px;
          padding:3px 8px;color:var(--text);z-index:5}
.t-bubble.show{opacity:1}
.t-bubble.ba{color:var(--blue)}.t-bubble.bb{color:var(--purple)}
.t-dates{display:flex;justify-content:space-between;font-family:var(--font-mono);font-size:10.5px}
.t-dates .da{color:var(--blue)}.t-dates .db{color:var(--purple)}
/* 对比主体 */
.hero-wrap{padding:6px 24px 24px}
.hero{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;
      display:flex;flex-direction:column}
.viewbar{display:flex;justify-content:space-between;align-items:center;padding:8px 16px;
         border-bottom:1px solid var(--line)}
.viewbar .lbl{font-size:10.5px;color:var(--faint);letter-spacing:1px}
.vtoggle{display:flex;gap:2px;background:var(--panel2);border-radius:7px;padding:2px}
.vtoggle button{border:0;background:none;padding:3px 10px;border-radius:5px;font-size:11px;
                color:var(--faint);cursor:pointer}
.vtoggle button.on{background:var(--panel);color:var(--text)}
.colheads{display:flex}
.colhead{flex:1;min-width:0}
.colhead .accent{height:3px}
.colhead .accent.a{background:var(--blue)}
.colhead .accent.b{background:var(--purple)}
.colhead .in{display:flex;gap:8px;align-items:center;padding:8px 16px;background:var(--head);
             border-bottom:1px solid var(--line)}
.colhead[data-side="B"] .in{border-left:1px solid var(--line)}
.colhead .dot{width:7px;height:7px;border-radius:4px;flex:none}
.colhead .nm{font-family:var(--font-mono);font-size:12.5px;color:var(--plain);
             white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* 成本与适配标记 */
.colhead .in-col{display:flex;flex-direction:column;gap:3px;min-width:0;flex:1}
.colhead .in-row{display:flex;gap:8px;align-items:center;min-width:0}
.colhead .meta-row{flex-wrap:wrap}
.costchip{display:inline-flex;gap:4px;align-items:center;font-family:var(--font-mono);
          font-size:10.5px;color:var(--dim);background:var(--panel2);
          padding:2px 8px;border-radius:999px;white-space:nowrap}
.bindchip{font-size:10px;padding:2px 8px;border-radius:999px;white-space:nowrap}
.bindchip.cc{background:var(--orange-bg);color:var(--orange)}
.bindchip.port{background:var(--green-bg);color:var(--green)}
.stylechip{font-size:10px;padding:2px 8px;border-radius:999px;
           border:1px solid var(--line);color:var(--faint);white-space:nowrap}
/* 结构目录 */
.toc{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:8px 16px;
     border-bottom:1px solid var(--line)}
.toc .toc-label{font-size:10.5px;color:var(--faint)}
.toc-chip{display:inline-flex;gap:5px;align-items:center;padding:3px 10px;border-radius:999px;
          border:1px solid var(--line);background:var(--panel);cursor:pointer;
          font-family:var(--font-mono);font-size:10.5px;color:var(--plain)}
.toc-chip:hover{border-color:var(--blue)}
.toc-chip .pd{width:6px;height:6px;border-radius:3px;display:inline-block}
.toc-chip .pd.a{background:var(--blue)}.toc-chip .pd.b{background:var(--purple)}
/* 分段正文:两列独立滚动 */
.diffbody{display:flex;min-height:0}
body.view-sections .diffbody{height:calc(100vh - 420px);min-height:300px;overflow:hidden}
body.view-sections .diffcol{overflow-y:auto;height:100%}
body.view-raw .diffbody{height:calc(100vh - 320px);min-height:320px}
.diffcol{flex:1;min-width:0}
.diffcol[data-side="A"]{border-right:1px solid var(--line)}
.sec{border-bottom:1px solid var(--dimline)}
.sec-band{display:flex;gap:8px;align-items:center;padding:7px 16px;background:var(--head);
          border-bottom:1px solid var(--line);position:sticky;top:0;z-index:2}
.sec-band .lvl{font-family:var(--font-mono);font-size:10px;color:var(--faint);
               border:1px solid var(--line);padding:1px 5px;border-radius:4px;flex:none;min-width:22px;text-align:center}
.sec-band .st{font-family:var(--font-mono);font-size:12px;color:var(--text);font-weight:600;
              white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sec-band .cnt{margin-left:auto;font-family:var(--font-mono);font-size:10px;color:var(--gutter);flex:none}
.sec-body .dr{display:flex;align-items:flex-start}
.sec-body .dr .g{width:44px;flex:none;text-align:right;padding-right:8px;
                 font-family:var(--font-mono);font-size:10.5px;color:var(--gutter);user-select:none}
.sec-body .dr .t{flex:1;font-family:var(--font-mono);font-size:12px;line-height:1.5;
                 white-space:pre-wrap;word-break:break-word;padding-right:10px;color:var(--plain)}
/* 选择器:标签行 + set 徽章 */
.tagsec{padding:8px 14px 4px;border-bottom:1px solid var(--line)}
.tagrow{display:flex;gap:5px;flex-wrap:wrap}
.tagchip{border:1px solid var(--line);background:none;color:var(--faint);
         border-radius:999px;padding:2px 10px;font-size:10.5px;cursor:pointer;
         font-family:var(--font-mono)}
.tagchip:hover{border-color:var(--blue);color:var(--text)}
.tagchip.on{background:var(--panel2);border-color:var(--blue);color:var(--blue)}
.setchip{font-size:9.5px;padding:2px 7px;border-radius:5px;flex:none;
         background:var(--panel2);border:1px solid var(--line);color:var(--dim);white-space:nowrap}
.row .cf{color:var(--orange);font-size:9.5px;max-width:140px;overflow:hidden;
         text-overflow:ellipsis;white-space:nowrap;flex:none}
.row .nm b{color:var(--blue);font-weight:700}
/* 重名冲突提醒 */
.conflict-banner{display:flex;gap:10px;align-items:center;padding:10px 24px;
                 background:var(--orange-bg);color:var(--orange);font-size:12.5px}
.conflict-banner b{color:var(--text);font-weight:600}
.conflict-banner .spacer{flex:1}
.cb-btn{flex:none;padding:5px 12px;border-radius:7px;border:1px solid var(--orange);
        background:none;color:var(--orange);cursor:pointer;font-size:12px}
.cb-btn:hover{background:var(--orange-bg)}
.picker .cf{color:var(--orange);font-size:10px;flex:none}
/* 附属文件对比 */
.filesgrid{display:flex;flex-direction:column;width:100%;overflow-y:auto;max-height:calc(100vh - 320px)}
.frow{display:flex;align-items:stretch;border-bottom:1px solid var(--dimline)}
.fmid{width:34%;flex:none;display:flex;gap:8px;align-items:center;padding:6px 12px;min-width:0}
.fpath{font-family:var(--font-mono);font-size:11.5px;color:var(--text);
       white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fst{font-size:9.5px;padding:1px 6px;border-radius:4px;flex:none}
.fst.same{background:var(--green-bg);color:var(--green)}
.fst.differs{background:var(--orange-bg);color:var(--orange)}
.fst.only-a,.fst.only-b{background:var(--panel2);color:var(--faint)}
.fc{flex:1;min-width:0;display:flex;align-items:center;padding:4px 10px}
.fc:first-child{border-right:1px solid var(--line)}
.fc-empty{color:var(--gutter);font-size:11px}
.fc-file{display:flex;gap:8px;align-items:center;width:100%;background:none;border:0;
         cursor:pointer;padding:3px 6px;border-radius:6px;color:var(--plain)}
.fc-file:hover{background:var(--panel2);color:var(--blue)}
.fc-file .mono{font-family:var(--font-mono);font-size:11px;white-space:nowrap;
               overflow:hidden;text-overflow:ellipsis}
.fc-meta{margin-left:auto;font-family:var(--font-mono);font-size:10px;color:var(--faint);flex:none}
.fc-img{display:flex;gap:6px;align-items:center;background:none;border:0;cursor:pointer;padding:2px}
.fc-img img{width:44px;height:44px;object-fit:contain;border-radius:6px;background:var(--panel2)}
/* 降级列 */
.lockcol{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;
         justify-content:center;gap:12px;padding:24px}
.lockcol .circle{width:46px;height:46px;border-radius:23px;background:var(--orange-bg);
                 display:flex;align-items:center;justify-content:center}
.lockcol .note{color:var(--dim);font-size:13px}
.lockcol .ghost{padding:8px 14px;border-radius:8px;border:1px solid var(--line);color:var(--dim);
                font-size:12.5px;cursor:pointer;background:none}
.lockcol .ghost:hover{color:var(--text);border-color:var(--dim)}
/* Monaco / 回退 */
#monaco{height:100%}
.fallback{display:flex;height:100%}
.fallback pre{flex:1;margin:0;padding:12px;overflow:auto;font-family:var(--font-mono);
              font-size:12px;line-height:1.5;color:var(--plain);white-space:pre-wrap}
.fallback pre+pre{border-left:1px solid var(--line)}
.loading{padding:24px;color:var(--faint);font-size:12px;text-align:center}
</style>
</head>
<body class="view-sections">
<div id="app"></div>
<script id="manifest" type="application/json">__MANIFEST__</script>
<script src="app.js"></script>
</body>
</html>
