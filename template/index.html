<!doctype html>
<html lang="zh" data-theme="tokyo-night">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark light">
<meta name="build" content="__BUILD_STAMP__">
<title>Skill History — Agent Skills 演化时间轴</title>
<style>
__THEME_CSS__
:root{--font-ui:-apple-system,'PingFang SC','Segoe UI',Roboto,sans-serif;
      --font-mono:'SF Mono',ui-monospace,Menlo,Consolas,'JetBrains Mono',monospace;}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{background:var(--bg);color:var(--text);font:14px/1.5 var(--font-ui);min-height:100vh;overflow:hidden}
a{color:var(--blue);text-decoration:none}a:hover{text-decoration:underline}
button{font-family:var(--font-ui)}
.hidden{display:none !important}
#app{display:flex;flex-direction:column;height:100vh}
/* ── 单行顶栏 ── */
.topbar{display:flex;align-items:center;gap:10px;padding:10px 20px;
        border-bottom:1px solid var(--dimline);min-height:44px;flex:none}
.brand{display:flex;gap:7px;align-items:center;flex:none}
.brand svg{display:block}
.brand .bn{font-size:13px;font-weight:600;color:var(--text);white-space:nowrap}
.topright{display:flex;gap:8px;align-items:center;margin-left:auto;flex:none}
.lang{display:flex;gap:1px;padding:2px;background:var(--panel2);border-radius:6px}
.lang button{border:0;background:none;padding:2px 8px;border-radius:4px;font-size:11px;color:var(--faint);cursor:pointer}
.lang button.on{background:var(--panel);color:var(--text)}
.theme-sel{background:var(--panel2);color:var(--dim);border:1px solid var(--line);border-radius:6px;
           padding:3px 7px;font-size:11px;cursor:pointer;outline:none}
/* ── 紧凑控制台:库选择器(左)+ 版本下拉 A/B,单行定顶 ── */
.console{display:flex;align-items:center;gap:8px;padding:10px 20px 6px;width:100%;flex:none}
.libslot,.vbtn{position:relative;display:flex;align-items:center;gap:9px;height:44px;
      padding:0 13px;background:var(--blue-soft);border:2px solid var(--blue);
      border-radius:11px;cursor:pointer;min-width:0}
.libslot{flex:1 1 auto;min-width:220px;max-width:520px}
.libslot input{flex:1;background:none;border:0;outline:none;color:var(--text);
               font-family:var(--font-mono);font-size:13px;font-weight:600;min-width:0}
.libslot .name{font-family:var(--font-mono);font-size:13px;font-weight:600;color:var(--text);
            white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.libslot .vcount{flex:none;font-family:var(--font-mono);font-size:9.5px;color:var(--dim);
            background:var(--panel2);padding:1px 7px;border-radius:999px;white-space:nowrap}
.libslot .warn,.vbtn .warn{flex:none;padding:2px 6px;border-radius:5px;background:var(--orange-bg);
            color:var(--orange);font-size:10px}
.vbtn{flex:1 1 300px;min-width:240px;background:var(--panel2);border-color:var(--purple-ring)}
.vbtn.a{border-color:var(--blue)}
.vbtn.open{background:var(--panel)}
.vbtn .badge{width:21px;height:21px;border-radius:11px;background:var(--panel2);color:var(--blue);
             display:flex;align-items:center;justify-content:center;
             font-family:var(--font-mono);font-size:10.5px;font-weight:600;flex:none}
.vbtn.b .badge{color:var(--purple)}
.vbtn .vsum{font-family:var(--font-mono);font-size:11.5px;color:var(--plain);white-space:nowrap;
            overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.libslot .spacer,.vbtn .spacer{flex:1}
/* 版本下拉面板:右对齐锚定,最小宽度保证 chg/行数 不被截断 */
.vpanel{position:absolute;top:calc(100% + 6px);right:0;z-index:60;min-width:430px;
        background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;
        box-shadow:0 12px 32px #000000a0;max-height:380px;overflow-y:auto}
.vpanel .vg-label{font-size:10px;color:var(--faint);letter-spacing:1px;padding:8px 12px 3px}
.vpanel .divider{height:1px;background:var(--line)}
.vrow{display:flex;gap:8px;align-items:center;padding:6px 12px;cursor:pointer;min-height:30px}
.vrow:hover,.vrow.cur{background:var(--panel2)}
.vrow .vt{font-family:var(--font-mono);font-size:10px;color:var(--orange);flex:none;width:82px;
          background:var(--orange-bg);padding:1px 6px;border-radius:4px;
          white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vrow .vdot{width:6px;height:6px;border-radius:4px;background:var(--gutter);flex:none;margin-right:76px}
.vrow .vd{font-family:var(--font-mono);font-size:11px;color:var(--plain);flex:none}
.vrow .chg{font-family:var(--font-mono);font-size:9.5px;flex:none}
.vrow .chg .up{color:var(--green)}.vrow .chg .dn{color:var(--red)}
.vrow .chg.dimchg,.vrow .meta{font-family:var(--font-mono);font-size:9.5px;color:var(--gutter);flex:none}
.vrow .spacer{flex:1}
.vrow .chk{color:var(--blue);flex:none}
/* 库选择面板 */
.picker{position:absolute;top:calc(100% + 6px);left:0;right:0;z-index:60;
        background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;
        box-shadow:0 12px 36px #000000a0;max-height:440px;overflow-y:auto}
.picker .sec{padding:10px 14px 6px}
.picker .sec-label{font-size:10px;color:var(--faint);letter-spacing:1px;padding-bottom:5px;
                   display:flex;gap:5px;align-items:center}
.picker .feat{display:flex;gap:7px;align-items:center;padding:7px 10px;border-radius:8px;cursor:pointer}
.picker .feat:hover{background:var(--panel2)}
.picker .feat .t{font-family:var(--font-mono);font-size:11.5px;color:var(--plain);flex:0 1 auto;
                 white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.picker .feat .fmeta{font-size:9.5px;color:var(--gutter);white-space:nowrap}
.picker .divider{height:1px;background:var(--line)}
.picker .row{display:flex;gap:7px;align-items:center;padding:7px 10px;border-radius:8px;cursor:pointer}
.picker .row:hover,.picker .row.sel{background:var(--panel2)}
.picker .row .selbar{width:2px;height:16px;border-radius:1px;background:var(--blue);flex:none}
.picker .row .nm{font-family:var(--font-mono);font-size:12px;color:var(--text)}
.picker .row .spacer{flex:1}
.picker .row .meta{font-family:var(--font-mono);font-size:10px;color:var(--faint);white-space:nowrap}
.picker .empty{padding:16px;color:var(--faint);font-size:12px;text-align:center}
.tagsec{padding:8px 14px 0}
.tagrow{display:flex;gap:5px;flex-wrap:wrap}
.tagchip{border:1px solid var(--line);background:none;color:var(--faint);font-size:10px;
         padding:1px 8px;border-radius:999px;cursor:pointer}
.tagchip.on{color:var(--blue);border-color:var(--blue)}
.lic-badge{padding:2px 6px;border-radius:5px;font-size:10px;flex:none}
.lic-badge.full{background:var(--green-bg);color:var(--green)}
.lic-badge.deg{background:var(--orange-bg);color:var(--orange)}
/* 时间轴区(组件本体样式由 timeline.js 注入) */
.tlwrap{padding:2px 20px 4px;flex:none}
.tlhint{font-size:10.5px;color:var(--gutter);padding:0 2px 2px}
/* 对比列头 */
.hero-wrap{flex:1;min-height:0;display:flex;padding:0 20px 12px}
.hero{flex:1;min-width:0;display:flex;flex-direction:column;
      background:var(--panel);border:1px solid var(--dimline);border-radius:12px;overflow:hidden}
.colheads{display:flex;flex:none}
.colhead{flex:1;min-width:0}
.colhead .accent{height:3px}
.colhead .accent.a{background:var(--blue)}
.colhead .accent.b{background:var(--purple)}
.colhead .in{display:flex;gap:7px;align-items:center;padding:7px 14px;background:var(--head);
             border-bottom:1px solid var(--line)}
.colhead[data-side="B"] .in{border-left:1px solid var(--line)}
.colhead .dot{width:7px;height:7px;border-radius:4px;flex:none}
.colhead .nm{font-family:var(--font-mono);font-size:12px;color:var(--plain);
             white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.colhead .costchip{display:inline-flex;gap:4px;align-items:center;
  font-family:var(--font-mono);font-size:10px;color:var(--faint);
  background:var(--panel2);padding:2px 7px;border-radius:999px;white-space:nowrap}
.colhead .bindchip{font-size:9.5px;padding:1px 7px;border-radius:999px;white-space:nowrap}
.colhead .bindchip.cc{background:var(--orange-bg);color:var(--orange)}
.colhead .bindchip.port{background:var(--green-bg);color:var(--green)}
.colhead .stylechip{font-size:9.5px;padding:1px 7px;border-radius:999px;
  border:1px solid var(--line);color:var(--faint);white-space:nowrap}
/* 视图切换 + diff 主体 */
.viewbar{flex:none}
.vtoggle{display:flex;gap:2px;padding:4px 14px 2px}
.vtoggle button{border:1px solid var(--line);background:none;padding:2px 10px;border-radius:6px;
                font-size:11px;color:var(--faint);cursor:pointer}
.vtoggle button.on{color:var(--blue);border-color:var(--blue)}
.diffbody{flex:1;min-height:0;display:flex;overflow:hidden;position:relative}
.diffcol{flex:1;min-width:0;overflow-y:auto;height:100%}
.diffcol[data-side="A"]{border-right:1px solid var(--line)}
.diffcol[data-side="B"]{padding-right:20px}
.sec{border-bottom:1px solid var(--dimline)}
.sec-band{display:flex;gap:7px;align-items:center;padding:6px 14px;background:var(--head);
          border-bottom:1px solid var(--line);position:sticky;top:0;z-index:2;cursor:pointer}
.sec-band .tw{display:flex;transition:transform .12s;flex:none}
.sec.collapsed .tw{transform:rotate(-90deg)}
.sec.collapsed .sec-body{display:none}
.sec-band .lvl{font-family:var(--font-mono);font-size:9.5px;color:var(--faint);
               border:1px solid var(--line);padding:1px 4px;border-radius:3px;flex:none}
.sec-band .st{font-family:var(--font-mono);font-size:11.5px;color:var(--text);font-weight:600;
              white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sec-band .cnt{margin-left:auto;font-family:var(--font-mono);font-size:9.5px;color:var(--gutter);flex:none}
.sec-band .chg{font-family:var(--font-mono);font-size:9.5px;padding:1px 6px;border-radius:4px;
               flex:none;background:var(--orange-bg)}
.sec-band .chg .up{color:var(--green)}.sec-band .chg .dn{color:var(--red)}
.sec-body .dr{display:flex;align-items:flex-start}
.sec-body .dr .g{width:36px;flex:none;text-align:right;padding-right:7px;
                 font-family:var(--font-mono);font-size:10px;color:var(--gutter);user-select:none}
.sec-body .dr .t{flex:1;font-family:var(--font-mono);font-size:11.5px;line-height:1.5;
                 white-space:pre-wrap;word-break:break-word;padding-right:8px;color:var(--plain)}
/* 行级变更:整行底色 + 行内词级高亮(更强的色块);对侧占位空行 */
.dr.mod-a{background:var(--red-bg)}
.dr.mod-b{background:var(--green-bg)}
.dr.mod-a .t,.dr.mod-b .t{color:var(--text)}
.dr .hl{font-weight:600;border-radius:3px;padding:0 1px}
.dr.mod-a .hl{background:color-mix(in srgb,var(--red) 40%,transparent);color:var(--red)}
.dr.mod-b .hl{background:color-mix(in srgb,var(--green) 38%,transparent);color:var(--green)}
.dr.gap{min-height:17.25px}
.dr .g.gg{color:var(--gutter);opacity:.6}
.sec-body .dr.absent{justify-content:center;padding:10px;color:var(--gutter);
                     font-size:10.5px;font-style:italic}
/* 变更缩略条:右缘窄条,红=删除区/绿=新增区,点击跳转,带视口指示 */
.minimap{position:absolute;top:0;right:0;bottom:0;width:18px;z-index:4;cursor:pointer;
         background:color-mix(in srgb,var(--panel2) 55%,transparent);border-left:1px solid var(--dimline)}
.mm-mark{position:absolute;min-height:2px;border-radius:1px;opacity:.85}
.mm-mark.del{left:3px;width:calc(50% - 4px);background:var(--red)}
.mm-mark.ins{right:3px;width:calc(50% - 4px);background:var(--green)}
.mm-view{position:absolute;left:0;right:0;min-height:6px;pointer-events:none;
         background:color-mix(in srgb,var(--dim) 20%,transparent);
         border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.loading{padding:20px;color:var(--faint);font-size:12px}
/* 降级展示 */
.lockcol{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;
         justify-content:center;gap:10px;padding:20px}
.lockcol .circle{width:42px;height:42px;border-radius:21px;background:var(--orange-bg);
                 display:flex;align-items:center;justify-content:center}
.lockcol .note{color:var(--dim);font-size:12.5px}
.lockcol .ghost{padding:7px 13px;border-radius:8px;border:1px solid var(--line);color:var(--dim);
                font-size:12px;cursor:pointer;background:none}
.lockcol .ghost:hover{color:var(--text);border-color:var(--dim)}
/* Monaco / 回退 */
#monaco{height:100%}
.fallback{display:flex;height:100%;width:100%}
.fallback pre{flex:1;margin:0;padding:10px;overflow:auto;font-family:var(--font-mono);
              font-size:11.5px;line-height:1.5;color:var(--plain);white-space:pre-wrap}
.fallback pre+pre{border-left:1px solid var(--line)}
</style>
</head>
<body class="view-sections">
<div id="app"></div>
<script id="manifest" type="application/json">__MANIFEST__</script>
<script src="timeline.js?v=__BUILD_STAMP__"></script>
<script src="app.js?v=__BUILD_STAMP__"></script>
</body>
</html>
