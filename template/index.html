<!doctype html>
<html lang="zh" data-theme="tokyo-night">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark light">
<meta name="build" content="__BUILD_STAMP__">
<title>Skill History — Agent Skills 演化时间轴</title>
<style>
__THEME_CSS__
:root{--font-ui:-apple-system,'PingFang SC','Segoe UI',Roboto,sans-serif;
      --font-mono:'SF Mono',ui-monospace,Menlo,Consolas,'JetBrains Mono',monospace;}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font:14px/1.5 var(--font-ui);min-height:100vh}
a{color:var(--blue);text-decoration:none}a:hover{text-decoration:underline}
button{font-family:var(--font-ui)}
.hidden{display:none !important}
/* ── 单行顶栏 ── */
.topbar{display:flex;align-items:center;gap:10px;padding:10px 20px;
        border-bottom:1px solid var(--dimline);min-height:44px}
.brand{display:flex;gap:7px;align-items:center;flex:none}
.brand svg{display:block}
.brand .bn{font-size:13px;font-weight:600;color:var(--text);white-space:nowrap}
.topright{display:flex;gap:8px;align-items:center;margin-left:auto;flex:none}
.lang{display:flex;gap:1px;padding:2px;background:var(--panel2);border-radius:6px}
.lang button{border:0;background:none;padding:2px 8px;border-radius:4px;font-size:11px;color:var(--faint);cursor:pointer}
.lang button.on{background:var(--panel);color:var(--text)}
.theme-sel{background:var(--panel2);color:var(--dim);border:1px solid var(--line);border-radius:6px;
           padding:3px 7px;font-size:11px;cursor:pointer;outline:none}
/* ── 控制栏：全部控件单行 ── */
.controls{display:flex;align-items:center;gap:8px;padding:10px 20px 6px;width:100%}
.slot{position:relative;flex:1;display:flex;align-items:center;gap:9px;height:44px;
      padding:0 13px;background:var(--blue-soft);border:2px solid var(--blue);
      border-radius:11px;cursor:pointer;min-width:0}
.slot[data-side="B"]{background:var(--purple-soft);border-color:var(--purple-ring)}
.slot .badge{width:22px;height:22px;border-radius:12px;background:var(--panel2);color:var(--blue);
             display:flex;align-items:center;justify-content:center;
             font-family:var(--font-mono);font-size:11px;font-weight:600;flex:none}
.slot[data-side="B"] .badge{color:var(--purple)}
.slot .slot-icon{flex:none}
.slot[data-side="A"] .slot-icon,.slot[data-side="A"] .chev{color:var(--blue)}
.slot[data-side="B"] .slot-icon,.slot[data-side="B"] .chev{color:var(--purple)}
.slot .name{font-family:var(--font-mono);font-size:13px;font-weight:600;color:var(--text);
            white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot .timechip{display:inline-flex;gap:3px;align-items:center;flex:none;
                font-family:var(--font-mono);font-size:9.5px;color:var(--dim);
                background:var(--panel2);padding:1px 6px;border-radius:999px}
.slot .warn{flex:none;padding:2px 6px;border-radius:5px;background:var(--orange-bg);
            color:var(--orange);font-size:10px}
.slot .spacer{flex:1}
.slot input{flex:1;background:none;border:0;outline:none;color:var(--text);
            font-family:var(--font-mono);font-size:13px;font-weight:600;min-width:0}
.slot .chev{flex:none}
.swap{flex:none;width:36px;height:36px;border-radius:18px;background:var(--panel2);
      border:1px solid var(--line);display:flex;align-items:center;justify-content:center;cursor:pointer}
.swap:hover{border-color:var(--blue)}
/* 模式 tabs */
.mode-tabs{display:flex;gap:2px;padding:2px;background:var(--panel2);border-radius:7px;flex:none}
.mode-tabs button{border:0;background:none;padding:3px 10px;border-radius:5px;font-size:11px;
                  color:var(--faint);cursor:pointer;white-space:nowrap}
.mode-tabs button.on{background:var(--panel);color:var(--blue)}
/* 选择面板 */
.picker{position:absolute;top:calc(100% + 6px);left:0;right:0;z-index:60;
        background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;
        box-shadow:0 12px 36px #000000a0;max-height:440px;overflow-y:auto}
.picker .sec{padding:10px 14px 6px}
.picker .sec-label{font-size:10px;color:var(--faint);letter-spacing:1px;padding-bottom:5px;
                   display:flex;gap:5px;align-items:center}
.picker .feat{display:flex;gap:7px;align-items:center;padding:7px 10px;border-radius:8px;cursor:pointer}
.picker .feat:hover{background:var(--panel2)}
.picker .feat .t{font-family:var(--font-mono);font-size:11.5px;color:var(--plain);flex:1}
.picker .divider{height:1px;background:var(--line)}
.picker .row{display:flex;gap:7px;align-items:center;padding:7px 10px;border-radius:8px;cursor:pointer}
.picker .row:hover,.picker .row.sel{background:var(--panel2)}
.picker .row .selbar{width:2px;height:16px;border-radius:1px;background:var(--blue);flex:none}
.picker .row .nm{font-family:var(--font-mono);font-size:12px;color:var(--text)}
.picker .row .spacer{flex:1}
.picker .row .meta{font-family:var(--font-mono);font-size:10px;color:var(--faint);white-space:nowrap}
.picker .empty{padding:16px;color:var(--faint);font-size:12px;text-align:center}
.lic-badge{padding:2px 6px;border-radius:5px;font-size:10px;flex:none}
.lic-badge.full{background:var(--green-bg);color:var(--green)}
.lic-badge.deg{background:var(--orange-bg);color:var(--orange)}
/* 时间轴 */
.tl-wrap{padding:4px 20px 4px 20px}
.tl-head{display:flex;gap:10px;align-items:center;padding:2px 0 4px;font-size:10.5px;color:var(--faint)}
.tl-head .lbl{display:flex;gap:5px;align-items:center}
.tl-head .hint{margin-left:auto}
.tl-slider{position:relative;height:34px}
.tl-slider .line{position:absolute;left:6px;right:6px;top:16px;height:2px;background:var(--line);border-radius:1px}
.t-slider input[type=range]{position:absolute;left:0;width:100%;top:6px;height:22px;margin:0;
  -webkit-appearance:none;appearance:none;background:none;pointer-events:none;outline:none}
.t-slider input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;pointer-events:auto;
  width:16px;height:16px;border-radius:9px;cursor:grab;border:2px solid var(--bg)}
.t-slider input[type=range]::-moz-range-thumb{pointer-events:auto;width:14px;height:14px;
  border-radius:8px;cursor:grab;border:2px solid var(--bg)}
.t-slider input.ts-a::-webkit-slider-thumb{background:var(--blue)}
.t-slider input.ts-b::-webkit-slider-thumb{background:var(--purple)}
.t-slider input.ts-a::-moz-range-thumb{background:var(--blue)}
.t-slider input.ts-b::-moz-range-thumb{background:var(--purple)}
.t-slider input.ts-a:active::-webkit-slider-thumb,.t-slider input.ts-b:active::-webkit-slider-thumb{cursor:grabbing}
.t-star{position:absolute;top:-4px;transform:translateX(-50%);color:var(--orange);
        font-size:10px;pointer-events:none}
.t-bubble{position:absolute;top:-28px;transform:translateX(-50%);opacity:0;pointer-events:none;
          transition:opacity .12s;white-space:pre;text-align:center;
          font-family:var(--font-mono);font-size:9.5px;line-height:1.4;
          background:var(--panel2);border:1px solid var(--line);border-radius:6px;
          padding:2px 7px;color:var(--text);z-index:5}
.t-bubble.show{opacity:1}
.t-bubble.ba{color:var(--blue)}.t-bubble.bb{color:var(--purple)}
.t-dates{display:flex;justify-content:space-between;font-family:var(--font-mono);font-size:10px;
         padding:2px 6px 0}
.t-dates .da{color:var(--blue)}.t-dates .db{color:var(--purple)}
.t-dates .chg{font-family:var(--font-mono);font-size:9.5px;padding:0 4px}
.t-dates .chg .up{color:var(--green)}.t-dates .chg .dn{color:var(--red)}
/* 版本下拉面板 */
.vpanel{position:absolute;top:calc(100% + 6px);left:0;right:0;z-index:60;
        background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;
        box-shadow:0 12px 32px #000000a0;max-height:360px;overflow-y:auto}
.vrow{display:flex;gap:7px;align-items:center;padding:7px 12px;cursor:pointer}
.vrow:hover{background:var(--panel2)}
.vrow.cur{background:var(--panel2)}
.vrow .vt{font-family:var(--font-mono);font-size:10px;color:var(--blue);
          background:var(--blue-soft);padding:1px 6px;border-radius:4px;flex:none}
.vrow .vd{font-family:var(--font-mono);font-size:11px;color:var(--plain);flex:1}
.vrow .vl{font-size:9.5px;color:var(--green);flex:none}
.vrow .chg{font-family:var(--font-mono);font-size:9.5px;flex:none}
.vrow .chg .up{color:var(--green)}.vrow .chg .dn{color:var(--red)}
.vrow .meta{font-family:var(--font-mono);font-size:9.5px;color:var(--gutter);flex:none}
.vrow .chk{color:var(--blue);flex:none}
/* 对比列头 */
.colheads{display:flex}
.colhead{flex:1;min-width:0}
.colhead .accent{height:3px}
.colhead .accent.a{background:var(--blue)}
.colhead .accent.b{background:var(--purple)}
.colhead .in{display:flex;gap:7px;align-items:center;padding:7px 14px;background:var(--head);
             border-bottom:1px solid var(--line)}
.colhead[data-side="B"] .in{border-left:1px solid var(--line)}
.colhead .dot{width:7px;height:7px;border-radius:4px;flex:none}
.colhead .nm{font-family:var(--font-mono);font-size:12px;color:var(--plain);
             white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.colhead .meta-row{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:4px 14px}
.colhead .meta-row .costchip{display:inline-flex;gap:4px;align-items:center;
  font-family:var(--font-mono);font-size:10px;color:var(--faint);
  background:var(--panel2);padding:2px 7px;border-radius:999px;white-space:nowrap}
.colhead .meta-row .bindchip{font-size:9.5px;padding:1px 7px;border-radius:999px;white-space:nowrap}
.colhead .meta-row .bindchip.cc{background:var(--orange-bg);color:var(--orange)}
.colhead .meta-row .bindchip.port{background:var(--green-bg);color:var(--green)}
.colhead .meta-row .stylechip{font-size:9.5px;padding:1px 7px;border-radius:999px;
  border:1px solid var(--line);color:var(--faint);white-space:nowrap}
/* diff 主体 */
.diffbody{display:flex;min-height:0}
body.view-sections .diffbody{height:calc(100vh - 310px);min-height:280px;overflow:hidden}
body.view-sections .diffcol{overflow-y:auto;height:100%}
body.view-raw .diffbody{height:calc(100vh - 260px);min-height:280px}
.diffcol{flex:1;min-width:0}
.diffcol[data-side="A"]{border-right:1px solid var(--line)}
.sec{border-bottom:1px solid var(--dimline)}
.sec-band{display:flex;gap:7px;align-items:center;padding:6px 14px;background:var(--head);
          border-bottom:1px solid var(--line);position:sticky;top:0;z-index:2;cursor:pointer}
.sec-band .tw{display:flex;transition:transform .12s;flex:none}
.sec.collapsed .tw{transform:rotate(-90deg)}
.sec.collapsed .sec-body{display:none}
.sec-band .lvl{font-family:var(--font-mono);font-size:9.5px;color:var(--faint);
               border:1px solid var(--line);padding:1px 4px;border-radius:3px;flex:none}
.sec-band .st{font-family:var(--font-mono);font-size:11.5px;color:var(--text);font-weight:600;
              white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sec-band .cnt{margin-left:auto;font-family:var(--font-mono);font-size:9.5px;color:var(--gutter);flex:none}
.sec-band .chg{font-family:var(--font-mono);font-size:9.5px;padding:1px 6px;border-radius:4px;flex:none}
.sec-band .chg .up{color:var(--green)}.sec-band .chg .dn{color:var(--red)}
.sec-body .dr{display:flex;align-items:flex-start}
.sec-body .dr .g{width:36px;flex:none;text-align:right;padding-right:7px;
                 font-family:var(--font-mono);font-size:10px;color:var(--gutter);user-select:none}
.sec-body .dr .t{flex:1;font-family:var(--font-mono);font-size:11.5px;line-height:1.5;
                 white-space:pre-wrap;word-break:break-word;padding-right:8px;color:var(--plain)}
.dr.mod-a{background:var(--red-bg)}.dr.mod-a .t{color:var(--text)}
.dr.mod-b{background:var(--green-bg)}.dr.mod-b .t{color:var(--text)}
/* 降级列 */
.lockcol{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;
         justify-content:center;gap:10px;padding:20px}
.lockcol .circle{width:42px;height:42px;border-radius:21px;background:var(--orange-bg);
                 display:flex;align-items:center;justify-content:center}
.lockcol .note{color:var(--dim);font-size:12.5px}
.lockcol .ghost{padding:7px 13px;border-radius:8px;border:1px solid var(--line);color:var(--dim);
                font-size:12px;cursor:pointer;background:none}
.lockcol .ghost:hover{color:var(--text);border-color:var(--dim)}
/* Monaco / 回退 */
#monaco{height:100%}
.fallback{display:flex;height:100%}
.fallback pre{flex:1;margin:0;padding:10px;overflow:auto;font-family:var(--font-mono);
              font-size:11.5px;line-height:1.5;color:var(--plain);white-space:pre-wrap}
.fallback pre+pre{border-left:1px solid var(--line)}
/* 附属文件 */
.filesgrid{display:flex;flex-direction:column;width:100%;overflow-y:auto;
           max-height:calc(100vh - 260px)}
.frow{display:flex;align-items:stretch;border-bottom:1px solid var(--dimline)}
.fmid{width:34%;flex:none;display:flex;gap:7px;align-items:center;padding:5px 12px;min-width:0}
.fpath{font-family:var(--font-mono);font-size:11px;color:var(--text);
       white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fst{font-size:9px;padding:1px 5px;border-radius:4px;flex:none}
.fst.same{background:var(--green-bg);color:var(--green)}
.fst.differs{background:var(--orange-bg);color:var(--orange)}
.fst.only-a,.fst.only-b{background:var(--panel2);color:var(--faint)}
.fc{flex:1;min-width:0;display:flex;align-items:center;padding:3px 10px}
.fc:first-child{border-right:1px solid var(--line)}
.fc-empty{color:var(--gutter);font-size:10.5px}
.fc-file{display:flex;gap:7px;align-items:center;width:100%;background:none;border:0;
         cursor:pointer;padding:2px 6px;border-radius:6px;color:var(--plain)}
.fc-file:hover{background:var(--panel2);color:var(--blue)}
.fc-file .mono{font-family:var(--font-mono);font-size:10.5px;white-space:nowrap;
               overflow:hidden;text-overflow:ellipsis}
.fc-meta{margin-left:auto;font-family:var(--font-mono);font-size:9.5px;color:var(--faint);flex:none}
.fc-img{display:flex;gap:5px;align-items:center;background:none;border:0;cursor:pointer;padding:2px}
.fc-img img{width:40px;height:40px;object-fit:contain;border-radius:6px;background:var(--panel2)}
/* 冲突横幅 */
.conflict-banner{display:flex;gap:9px;align-items:center;padding:8px 20px;
                 background:var(--orange-bg);color:var(--orange);font-size:12px}
.conflict-banner b{color:var(--text);font-weight:600}
.conflict-banner .spacer{flex:1}
.cb-btn{flex:none;padding:4px 11px;border-radius:7px;border:1px solid var(--orange);
        background:none;color:var(--orange);cursor:pointer;font-size:11.5px}
</style>
</head>
<body class="view-sections">
<div id="app"></div>
<script id="manifest" type="application/json">__MANIFEST__</script>
<script src="app.js?v=__BUILD_STAMP__"></script>
</body>
</html>
