<!doctype html>
<html lang="zh" data-theme="tokyo-night">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Skill Compare — Agent Skills 并排对比</title>
<style>
/* __THEME_CSS__ */
:root{--font-ui:-apple-system,'PingFang SC','Segoe UI',Roboto,sans-serif;
      --font-mono:'SF Mono',ui-monospace,Menlo,Consolas,'JetBrains Mono',monospace;}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font:14px/1.5 var(--font-ui);min-height:100vh}
a{color:var(--blue);text-decoration:none}a:hover{text-decoration:underline}
button{font-family:var(--font-ui)}
.mono{font-family:var(--font-mono)}
/* 顶栏 */
.topbar{display:flex;justify-content:space-between;align-items:center;padding:12px 24px;
        border-bottom:1px solid var(--dimline)}
.brand{display:flex;gap:9px;align-items:center;font-weight:600;font-size:14px;color:var(--text)}
.brand svg{display:block}
.topright{display:flex;gap:10px;align-items:center}
.lang{display:flex;gap:2px;padding:3px;background:var(--panel2);border-radius:7px}
.lang button{border:0;background:none;padding:3px 9px;border-radius:5px;font-size:11.5px;color:var(--faint);cursor:pointer}
.lang button.on{background:var(--panel);color:var(--text)}
.theme-sel{background:var(--panel2);color:var(--dim);border:1px solid var(--line);border-radius:7px;
           padding:4px 8px;font-size:11.5px;cursor:pointer;outline:none}
/* 控制台 */
.console{position:relative;display:flex;gap:14px;align-items:center;padding:16px 24px 12px}
.slot{position:relative;flex:1;display:flex;align-items:center;gap:11px;height:52px;padding:0 15px;
      background:var(--blue-soft);border:2px solid var(--blue);border-radius:12px;cursor:pointer}
.slot[data-side="B"]{background:var(--purple-soft);border-color:var(--purple-ring)}
.slot[data-side="B"] .badge{color:var(--purple)}
.slot[data-side="B"] .slot-icon{color:var(--purple)}
.slot[data-side="B"] .chev{color:var(--purple)}
.slot .badge{width:25px;height:25px;border-radius:13px;background:var(--panel2);color:var(--blue);
             display:flex;align-items:center;justify-content:center;
             font-family:var(--font-mono);font-size:12px;font-weight:600;flex:none}
.slot .slot-icon{color:var(--blue);flex:none}
.slot .name{font-family:var(--font-mono);font-size:14px;font-weight:600;color:var(--text);
            white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot .warn{flex:none;padding:3px 8px;border-radius:6px;background:var(--orange-bg);
            color:var(--orange);font-size:10.5px}
.slot .spacer{flex:1}
.slot .chev{color:var(--blue);flex:none}
.slot input{flex:1;background:none;border:0;outline:none;color:var(--text);
            font-family:var(--font-mono);font-size:14px;font-weight:600;min-width:0}
.swap{flex:none;width:42px;height:42px;border-radius:21px;background:var(--panel2);
      border:1px solid var(--line);display:flex;align-items:center;justify-content:center;cursor:pointer}
.swap:hover{border-color:var(--blue)}
/* 选择面板 */
.picker{position:absolute;top:calc(100% + 8px);left:0;right:0;z-index:60;
        background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;
        box-shadow:0 12px 36px #000000a0;max-height:480px;overflow-y:auto}
.picker .sec{padding:12px 14px 8px}
.picker .sec-label{font-size:10.5px;color:var(--faint);letter-spacing:1px;padding-bottom:6px}
.picker .feat{display:flex;gap:8px;align-items:center;padding:8px 10px;border-radius:8px;cursor:pointer}
.picker .feat:hover{background:var(--panel2)}
.picker .feat .t{font-family:var(--font-mono);font-size:12px;color:var(--plain);flex:1}
.picker .divider{height:1px;background:var(--line)}
.picker .row{display:flex;gap:8px;align-items:center;padding:9px 10px;border-radius:8px;cursor:pointer}
.picker .row:hover,.picker .row.sel{background:var(--panel2)}
.picker .row .selbar{width:2px;height:18px;border-radius:1px;background:var(--blue)}
.picker .row .nm{font-family:var(--font-mono);font-size:12.5px;color:var(--text)}
.picker .row .lic{padding:2px 6px;border-radius:5px;font-size:10px;flex:none}
.picker .row .lic.full{background:var(--green-bg);color:var(--green)}
.picker .row .lic.deg{background:var(--orange-bg);color:var(--orange)}
.picker .row .spacer{flex:1}
.picker .row .meta{font-family:var(--font-mono);font-size:10.5px;color:var(--faint);white-space:nowrap}
.picker .empty{padding:18px;color:var(--faint);font-size:12.5px;text-align:center}
.lic-badge{padding:2px 7px;border-radius:5px;font-size:10.5px;flex:none}
.lic-badge.full{background:var(--green-bg);color:var(--green)}
.lic-badge.deg{background:var(--orange-bg);color:var(--orange)}
/* 版本模式 */
.mode-row{display:flex;justify-content:space-between;align-items:center;padding:16px 24px 0}
.mode-left{display:flex;gap:8px;align-items:center}
.mode-pill{padding:4px 12px;border-radius:999px;background:var(--blue-soft);
           border:1px solid var(--blue);color:var(--blue);font-size:12px;font-weight:600}
.mode-name{font-family:var(--font-mono);font-size:14px;font-weight:600;color:var(--text)}
.mode-count{font-size:11.5px;color:var(--faint)}
.timeline{padding:4px 34px 0}
.t-flags{display:flex;align-items:flex-end}
.t-flags .flag{display:flex;gap:4px;padding:3px 9px;border-radius:999px;align-items:center;
               font-family:var(--font-mono);font-size:10.5px}
.t-flag-a{background:var(--blue-soft);color:var(--blue)}
.t-flag-b{background:var(--purple-soft);color:var(--purple)}
.t-rail{position:relative;height:18px}
.t-rail .line{position:absolute;left:0;right:0;top:8px;height:2px;background:var(--line)}
.t-dot{position:absolute;top:3px;width:12px;height:12px;border-radius:7px;background:var(--gutter);
       transform:translateX(-50%);cursor:pointer;border:0;padding:0}
.t-dot:hover{background:var(--dim)}
.t-dot.sel-a{background:var(--blue);top:1px;width:16px;height:16px;box-shadow:0 0 0 3px var(--blue-soft)}
.t-dot.sel-b{background:var(--purple);top:1px;width:16px;height:16px;box-shadow:0 0 0 3px var(--purple-soft)}
.t-dates{display:flex;justify-content:space-between;font-family:var(--font-mono);font-size:10.5px}
.t-dates .da{color:var(--blue)}.t-dates .db{color:var(--purple)}
/* 对比主体 */
.hero-wrap{padding:6px 24px 24px}
.hero{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;
      display:flex;flex-direction:column;min-height:480px;height:calc(100vh - 250px);min-height:420px}
.colheads{display:flex}
.colhead{flex:1;min-width:0}
.colhead .accent{height:3px}
.colhead .accent.a{background:var(--blue)}
.colhead .accent.b{background:var(--purple)}
.colhead .in{display:flex;gap:8px;align-items:center;padding:8px 16px;background:var(--head);
             border-bottom:1px solid var(--line)}
.colhead[data-side="B"] .in{border-left:1px solid var(--line)}
.colhead .dot{width:7px;height:7px;border-radius:4px;flex:none}
.colhead .nm{font-family:var(--font-mono);font-size:12.5px;color:var(--plain);
             white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.diffbody{display:flex;flex:1;min-height:0}
.diffcol{flex:1;min-width:0}
.diffcol[data-side="A"]{border-right:1px solid var(--line)}
.dr{display:flex;align-items:center}
.dr .g{width:44px;flex:none;text-align:right;padding-right:8px;
       font-family:var(--font-mono);font-size:10.5px;color:var(--gutter);user-select:none}
.dr .t{flex:1;font-family:var(--font-mono);font-size:12px;line-height:1.45;
       white-space:pre-wrap;word-break:break-word;padding-right:10px}
.dr.mod-a{background:var(--red-bg)}.dr.mod-a .t{color:var(--text)}
.dr.mod-b{background:var(--green-bg)}.dr.mod-b .t{color:var(--text)}
.dr.plain .t{color:var(--plain)}
/* 降级列 */
.lockcol{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;
         justify-content:center;gap:12px;padding:24px}
.lockcol .circle{width:46px;height:46px;border-radius:23px;background:var(--orange-bg);
                 display:flex;align-items:center;justify-content:center}
.lockcol .note{color:var(--dim);font-size:13px}
.lockcol .ghost{padding:8px 14px;border-radius:8px;border:1px solid var(--line);color:var(--dim);
                font-size:12.5px;cursor:pointer;background:none}
.lockcol .ghost:hover{color:var(--text);border-color:var(--dim)}
/* Monaco 容器 */
#monaco{height:100%}
.fallback{display:flex;height:100%}
.fallback pre{flex:1;margin:0;padding:12px;overflow:auto;font-family:var(--font-mono);
              font-size:12px;line-height:1.5;color:var(--plain);white-space:pre-wrap}
.fallback pre+pre{border-left:1px solid var(--line)}
.hidden{display:none !important}
</style>
</head>
<body>
<div id="app"></div>
<script id="manifest" type="application/json">__MANIFEST__</script>
<script>
"use strict";
const MANIFEST = JSON.parse(document.getElementById("manifest").textContent);
const BY = Object.fromEntries(MANIFEST.skills.map(s => [s.id, s]));

/* ---------- i18n(UI 文案;skill 内容一律原文) ---------- */
const I18N = {
  zh:{search:"搜索 skill…",featured:"✨ 精选组合",all:"全部 skill",empty:"没有匹配的 skill",
      lock:"专有许可 · 不转载原文",view:"查看原文 ↗",random:"随机换一对",mode:"版本模式",
      count:n=>`共 ${n} 个版本`,hint:"在时间轴上任选两个时间点即可对比;★ 为上游 tag 版本",
      full:"全文可比",deg:"专有 · 仅摘要"},
  en:{search:"Search skills…",featured:"✨ Featured pairs",all:"All skills",empty:"No matching skills",
      lock:"Proprietary license · original text not reproduced",view:"View source ↗",random:"Random pair",
      mode:"Version mode",count:n=>`${n} versions total`,
      hint:"Pick any two points on the timeline to compare; ★ marks upstream tags",
      full:"Full text",deg:"Proprietary · summary"}
};
/* ---------- 主题 ---------- */
const THEMES = __THEME_LIST__;
/* ---------- 状态 ---------- */
const q = new URLSearchParams(location.search);
const state = {
  a: q.get("a") || (MANIFEST.skills[0] && MANIFEST.skills[0].id) || "",
  b: q.get("b") || (MANIFEST.skills[1] && MANIFEST.skills[1].id) || "",
  va: parseInt(q.get("va") || "0", 10), vb: -1,
  lang: localStorage.getItem("lang") || "zh",
  theme: q.get("theme") || localStorage.getItem("theme") || "tokyo-night",
  picker: null,   // "a" | "b" | null
  query: ""
};
const t = k => { const v = I18N[state.lang][k]; return typeof v === "function" ? v(0) : v; };
const tf = (k, ...args) => { const v = I18N[state.lang][k]; return typeof v === "function" ? v(...args) : v; };

function syncURL() {
  const p = new URLSearchParams({a: state.a, b: state.b, lang: state.lang, theme: state.theme});
  if (isVersion()) { p.set("va", state.va); p.set("vb", state.vb); }
  history.replaceState(null, "", "?" + p.toString());
}
function isVersion() { return state.a && state.a === state.b; }
function skill(id) { return BY[id] || null; }
function setSlot(slot, id) { if (slot === "a") state.a = id; else state.b = id; if (!isVersion()) { state.va = 0; state.vb = -1; } syncURL(); render(); }
function setLang(l) { state.lang = l; localStorage.setItem("lang", l); document.documentElement.lang = l === "zh" ? "zh" : "en"; syncURL(); render(); }
function setTheme(th) { state.theme = th; localStorage.setItem("theme", th); document.documentElement.setAttribute("data-theme", th); syncURL(); }

/* ---------- 图标 ---------- */
const IC = {
  logo:'<path d="M13 5h6M13 9h6M6 15h6M6 19h6"/><circle cx="6" cy="7" r="2"/><circle cx="18" cy="17" r="2"/>',
  search:'<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>',
  chev:'<path d="m6 9 6 6 6-6"/>', swap:'<path d="M8 3 4 7l4 4"/><path d="M4 7h16"/><path d="m16 21 4-4-4-4"/><path d="M20 17H4"/>',
  gh:'<path d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.403 5.403 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65-.17.6-.22 1.23-.15 1.85v4"/><path d="M9 18c-4.51 2-5-2-7-2"/>',
  lock:'<rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>',
  info:'<circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/>',
  spark:'<path d="m12 3-1.9 5.8a2 2 0 0 1-1.3 1.3L3 12l5.8 1.9a2 2 0 0 1 1.3 1.3L12 21l1.9-5.8a2 2 0 0 1 1.3-1.3L21 12l-5.8-1.9a2 2 0 0 1-1.3-1.3z"/>',
  file:'<path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/>',
  hist:'<path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/>',
  check:'<path d="M20 6 9 17l-5-5"/>', arrowr:'<path d="M5 12h14"/><path d="m12 5 7 7-7 7"/>',
  star:'<polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>'
};
function icon(name, s, fill) {
  const color = fill || "currentColor";
  return `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex:none">${IC[name] || ""}</svg>`;
}

/* ---------- 渲染 ---------- */
let renderSeq = 0, monacoEd = null;
const app = document.getElementById("app");

function esc(s) { return s.replace(/&/g, "&amp;").replace(/</g, "&lt;"); }
function fmt(n) { return n == null ? "—" : (n >= 1e6 ? (n / 1e6).toFixed(1) + "M" : n >= 1e3 ? (n / 1e3).toFixed(1) + "k" : String(n)); }
function licBadge(lic) {
  const full = lic === "full";
  return `<span class="lic-badge ${full ? "full" : "deg"}">${esc(full ? t("full") : t("deg"))}</span>`;
}
function topbar() {
  const opts = THEMES.map(th => `<option value="${th.id}" ${th.id === state.theme ? "selected" : ""}>${esc(th.label)}</option>`).join("");
  return `<div class="topbar">
    <div class="brand">${icon("logo", 17, "var(--blue)")}<span>Skill Compare</span></div>
    <div class="topright">
      <div class="lang">
        <button class="${state.lang === "zh" ? "on" : ""}" data-act="lang-zh">中文</button>
        <button class="${state.lang === "en" ? "on" : ""}" data-act="lang-en">EN</button>
      </div>
      <select class="theme-sel" data-act="theme">${opts}</select>
      <a href="https://github.com/ohwald/skills-comparison" target="_blank" rel="noopener">${icon("gh", 17, "var(--dim)")}</a>
    </div></div>`;
}
function slotEl(side) {
  const id = side === "A" ? state.a : state.b;
  const s = skill(id);
  const color = side === "A" ? "var(--blue)" : "var(--purple)";
  const open = state.picker === side.toLowerCase();
  const warn = s && s.license_status === "degraded" ? `<span class="warn">${esc(t("deg"))}</span>` : "";
  const inner = open
    ? `<span class="badge">${side}</span>${icon("search", 15, color)}
       <input id="picker-input" placeholder="${esc(t("search"))}" autocomplete="off">`
    : `<span class="badge">${side}</span>${icon("search", 15, color)}
       <span class="name">${esc(s ? s.name : "—")}</span>${warn}<span class="spacer"></span>${icon("chev", 16, color)}`;
  return `<div class="slot" data-side="${side}" data-slot="${side.toLowerCase()}">${inner}
    ${open ? pickerPanel(side) : ""}</div>`;
}
function pickerPanel(side) {
  const q = state.query.toLowerCase();
  const hits = MANIFEST.skills.filter(s => !q || s.name.toLowerCase().includes(q) || (s.desc || "").toLowerCase().includes(q));
  const feats = MANIFEST.featured.map(p =>
    `<div class="feat" data-feat="${esc(p.join(" "))}">${icon("spark", 12, "var(--orange)")}
     <span class="t">${esc(p.join(" × "))}</span>${icon("arrowr", 13, "var(--gutter)")}</div>`).join("");
  const rows = hits.map(s => {
    const sel = s.id === state.a || s.id === state.b;
    return `<div class="row ${sel ? "sel" : ""}" data-pick="${esc(s.id)}">
      ${sel ? `<span class="selbar"></span>` : ""}
      <span class="nm">${esc(s.name)}</span>${licBadge(s.license_status)}
      <span class="spacer"></span><span class="meta">${esc(s.source)}</span>
      <span class="meta">${s.stars == null ? "" : "★" + fmt(s.stars)} ${s.installs == null ? "" : "⬇" + fmt(s.installs)} ${s.lines}行</span>
      ${sel ? icon("check", 13, "var(--blue)") : ""}</div>`;
  }).join("");
  return `<div class="picker" data-stop="1">
    <div class="sec"><div class="sec-label">${esc(t("featured"))}</div>${feats}</div>
    <div class="divider"></div>
    <div class="sec"><div class="sec-label">${esc(t("all"))} · ${MANIFEST.skills.length}</div>
    ${rows || `<div class="empty">${esc(t("empty"))}</div>`}</div></div>`;
}
function timelineEl(sk) {
  const vs = sk.versions || [];
  const n = vs.length;
  if (n < 2) return "";
  const pos = i => (n === 1 ? 50 : (i / (n - 1)) * 100);
  const dots = vs.map((v, i) => {
    const cls = i === state.va ? "sel-a" : (i === state.vb ? "sel-b" : "");
    const star = v.tags && v.tags.length ? " ★" : "";
    return `<button class="t-dot ${cls}" data-va="${i}" style="left:${pos(i)}%" title="${esc(v.date + " · " + v.sha + star)}"></button>`;
  }).join("");
  const flagA = vs[state.va] && vs[state.va].tags && vs[state.va].tags.length
    ? `<span class="flag t-flag-a">★ ${esc(vs[state.va].tags.join(", "))}</span>` : `<span></span>`;
  const flagB = vs[state.vb] && vs[state.vb].tags && vs[state.vb].tags.length
    ? `<span class="flag t-flag-b">★ ${esc(vs[state.vb].tags.join(", "))}</span>` : `<span></span>`;
  return `<div class="timeline">
    <div class="t-flags" style="justify-content:space-between;padding:0 30px">${flagA}${flagB}</div>
    <div class="t-rail"><div class="line"></div>${dots}</div>
    <div class="t-dates"><span class="da">${esc(vs[state.va].date + " · " + vs[state.va].sha)}</span>
    <span class="db">${esc(vs[state.vb].date + " · " + vs[state.vb].sha)}</span></div></div>`;
}
function versionConsole(sk) {
  return `<div class="mode-row"><div class="mode-left">
      <span class="mode-pill">${esc(t("mode"))}</span>
      <span class="mode-name">${esc(sk.name)}</span>
      <span class="mode-count">${esc(tf("count", sk.versions.length))}</span></div>
    <span class="mode-count">${esc(t("hint"))}</span></div>
    <div class="console" style="padding-top:12px">
      ${slotEl("A")}
      <div class="swap" data-act="swap">${icon("swap", 16, "var(--dim)")}</div>
      ${slotEl("B")}</div>
    ${timelineEl(sk)}`;
}
function versionText(slot) {
  const sk = skill(state.a); if (!sk) return "";
  const v = sk.versions[slot === "a" ? state.va : state.vb] || sk.versions[0];
  return v ? `${v.date} · ${v.sha}` : "";
}
/* 版本模式槽位显示时间点文本 */
function slotDisplayFix() {
  if (!isVersion()) return;
  document.querySelectorAll(".slot").forEach(el => {
    const side = el.getAttribute("data-side");
    const sk = skill(state.a); if (!sk) return;
    const v = sk.versions[side === "A" ? state.va : state.vb];
    const nm = el.querySelector(".name");
    if (nm && v) nm.textContent = `${v.date} · ${v.sha}`;
  });
}
function render() {
  renderSeq++;
  document.documentElement.setAttribute("data-theme", state.theme);
  document.documentElement.lang = state.lang === "zh" ? "zh" : "en";
  const A = skill(state.a), B = skill(state.b);
  const version = isVersion() && A && (A.versions || []).length >= 1;
  const consoleHtml = version && A
    ? versionConsole(A)
    : `<div class="console">${slotEl("A")}<div class="swap" data-act="swap">${icon("swap", 16, "var(--dim)")}</div>${slotEl("B")}</div>`;  let bodyHtml;
  if (!A || !B) bodyHtml = `<div class="diffbody"><div class="diffbody" style="justify-content:center;color:var(--faint)">—</div></div>`;
  else if (A.license_status === "full" && B.license_status === "full")
    bodyHtml = `<div class="diffbody"><div id="monaco" style="width:100%"></div></div>`;
  else {
    const pane = (s, fp) => s.license_status === "full"
      ? `<div class="diffcol" data-body="${fp}"></div>`
      : `<div class="lockcol"><div class="lockcol-circle" style="width:46px;height:46px;border-radius:23px;background:var(--orange-bg);display:flex;align-items:center;justify-content:center">
         ${icon("lock", 20, "var(--orange)")}</div>
         <div class="note">${esc(t("lock"))}</div>
         <button class="ghost" data-src="${esc(s.url)}">${esc(t("view"))}</button></div>`;
    bodyHtml = `<div class="diffbody">${pane(A, A.fp)}${pane(B, B.fp)}</div>`;
  }
  const heads = (A && B) ? `<div class="colheads">
    <div class="colhead" data-side="A"><div class="accent a"></div>
      <div class="in"><span class="dot" style="background:var(--blue)"></span>
      <span class="nm">${esc(version ? versionText("a") : A.name)}</span></div></div>
    <div class="colhead" data-side="B"><div class="accent b"></div>
      <div class="in"><span class="dot" style="background:var(--purple)"></span>
      <span class="nm">${esc(version && A === B ? versionText("b") : B.name)}</span></div></div></div>` : "";
  app.innerHTML = topbar() + consoleHtml +
    `<div class="hero-wrap"><div class="hero">${heads}${bodyHtml}</div></div>`;
  bind();
  mountDiff();
  slotDisplayFix();
}
/* ---------- diff 挂载 ---------- */
const bodyCache = new Map();
function fetchBody(fp) {
  if (bodyCache.has(fp)) return bodyCache.get(fp);
  const p = fetch("bodies/" + fp + ".md").then(r => r.ok ? r.text() : "");
  bodyCache.set(fp, p); return p;
}
function mountDiff() {
  const A = skill(state.a), B = skill(state.b);
  if (!A || !B) return;
  const my = renderSeq;
  if (A.license_status === "full" && B.license_status === "full") {
    Promise.all([fetchBody(A.fp), fetchBody(B.fp)]).then(([ta, tb]) => {
      if (my !== renderSeq) return;
      initMonaco(ta, tb, my);
    });
  } else {
    // 降级/混合:有正文的一侧填充文本
    document.querySelectorAll(".diffcol[data-body]").forEach(el => {
      const s = el.getAttribute("data-body") === A.fp ? A : B;
      fetchBody(el.getAttribute("data-body")).then(txt => {
        if (my !== renderSeq) return;
        el.innerHTML = rowsHtml(txt);
      });
    });
  }
}
function rowsHtml(text) {
  return text.split("\n").map((l, i) =>
    `<div class="dr plain"><span class="g">${i + 1}</span><span class="t">${esc(l) || " "}</span></div>`).join("");
}
function initMonaco(ta, tb, my) {
  const el = document.getElementById("monaco");
  if (!el || my !== renderSeq) return;
  const fail = () => { if (my !== renderSeq) return;
    el.outerHTML = `<div class="fallback"><pre>${esc(ta)}</pre><pre>${esc(tb)}</pre></div>`; };
  try {
    if (window.require) { init(); return; }
    const sc = document.createElement("script");
    sc.src = "https://cdn.jsdelivr.net/npm/monaco-editor@0.52.2/min/vs/loader.min.js";
    sc.onload = () => { require.config({paths:{vs:"https://cdn.jsdelivr.net/npm/monaco-editor@0.52.2/min/vs"}}); init(); };
    sc.onerror = fail; document.head.appendChild(sc);
    setTimeout(() => { if (!window.monaco && my === renderSeq && !document.querySelector(".monaco-editor")) fail(); }, 5000);
    function init() {
      if (my !== renderSeq || !document.getElementById("monaco")) return;
      require(["vs/editor/editor.main"], () => {
        if (my !== renderSeq || !document.getElementById("monaco")) return;
        if (monacoEd) { try { const ms=[monacoEd.getOriginalModel(),monacoEd.getModifiedModel()]; monacoEd.dispose(); ms.forEach(m=>m&&m.dispose&&m.dispose()); } catch(e){} }
        const mo = monaco.editor.createModel(ta, "markdown"), mm = monaco.editor.createModel(tb, "markdown");
        monacoEd = monaco.editor.createDiffEditor(el, {readOnly:true, originalEditable:false,
          renderSideBySide:true, wordWrap:"on", automaticLayout:true, diffAlgorithm:"advanced", theme:"vs-dark"});
        monacoEd.setModel({original:mo, modified:mm});
      }, fail);
    }
  } catch (e) { fail(); }
}
/* ---------- 事件 ---------- */
function bind() {
  app.querySelectorAll("[data-act]").forEach(el => {
    const act = el.getAttribute("data-act");
    if (act === "lang-zh") el.onclick = () => setLang("zh");
    if (act === "lang-en") el.onclick = () => setLang("en");
    if (act === "theme") el.onchange = e => setTheme(e.target.value);
    if (act === "swap") el.onclick = () => { [state.a, state.b] = [state.b, state.a];
      [state.va, state.vb] = [state.vb, state.va]; syncURL(); render(); };
  });
  const themeSel = app.querySelector('[data-act="theme"]');
  if (themeSel) themeSel.value = state.theme;
  app.querySelectorAll(".slot").forEach(el => {
    if (el.querySelector("input")) {
      const inp = el.querySelector("input");
      inp.value = state.query; inp.focus();
      inp.setSelectionRange(inp.value.length, inp.value.length);
      inp.oninput = () => { state.query = inp.value; render(); };
      inp.onkeydown = e => { if (e.key === "Escape") { state.picker = null; state.query = ""; render(); } };
    } else {
      el.onclick = e => { if (e.target.closest(".picker")) return;
        state.picker = el.getAttribute("data-slot"); state.query = ""; render(); };
    }
    const pk = el.querySelector(".picker");
    if (pk) {
      pk.onclick = e => e.stopPropagation();
      pk.querySelectorAll("[data-pick]").forEach(r => r.onclick = () => setSlot(state.picker, r.getAttribute("data-pick")));
      pk.querySelectorAll("[data-feat]").forEach(r => r.onclick = () => {
        const [x, y] = r.getAttribute("data-feat").split(" ");
        state.a = x; state.b = y; state.va = 0; state.vb = -1; state.picker = null; syncURL(); render();
      });
    }
  });
  document.onclick = e => {
    if (state.picker && !e.target.closest(".slot") && !e.target.closest(".picker")) {
      state.picker = null; state.query = ""; render();
    }
  };
  app.querySelectorAll(".t-dot").forEach(d => d.onclick = () => {
    const i = parseInt(d.getAttribute("data-va"), 10);
    if (state.va === state.vb) { if (i !== state.va) state.vb = i; }
    else { state.va = i; }
    syncURL(); render();
  });
  app.querySelectorAll("[data-src]").forEach(b => b.onclick = () => window.open(b.getAttribute("data-src"), "_blank"));
}
document.documentElement.setAttribute("data-theme", state.theme);
render();
</script>
</body>
</html>
