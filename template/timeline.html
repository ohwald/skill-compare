<title>时间轴原型 — Skill History v2(spec #21)</title>
<style>
:root{--font-ui:-apple-system,'PingFang SC','Segoe UI',Roboto,sans-serif;
      --font-mono:'SF Mono',ui-monospace,Menlo,Consolas,'JetBrains Mono',monospace}
/* tokyo-night(design.pen 基准主题) */
[data-theme="tokyo-night"]{--bg:#1a1b26;--panel:#1f2335;--panel2:#24283b;--head:#24283b;
  --line:#292e42;--dimline:#1f2335;--text:#c0caf5;--plain:#9aa5ce;--dim:#8b97bd;--faint:#565f89;
  --gutter:#3b4261;--blue:#7aa2f7;--blue-soft:#1f2b47;--purple:#bb9af7;--purple-soft:#252345;
  --purple-ring:#414868;--green:#9ece6a;--green-bg:#20303b;--red:#f7768e;--red-bg:#3f2a3c;
  --orange:#e0af68;--orange-bg:#3a2e1f}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font:14px/1.5 var(--font-ui);min-height:100vh}
.wrap{max-width:1280px;margin:0 auto;padding:26px 32px}
h1{font-size:15px;font-weight:600;margin:0 0 4px}
.sub{font-size:12px;color:var(--faint);margin-bottom:26px}
.sub b{color:var(--dim);font-weight:600}
.board{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 22px 18px}
.readout{margin-top:14px;font-family:var(--font-mono);font-size:11px;color:var(--dim);
         border-top:1px solid var(--dimline);padding-top:10px}
.readout b.ca{color:var(--blue)}.readout b.cb{color:var(--purple)}
.legend{display:flex;gap:14px;margin-top:8px;font-size:11px;color:var(--faint)}
.legend .o{color:var(--orange)}
</style>
</head>
<body data-theme="tokyo-night">
<div class="wrap">
  <h1>时间轴交互原型</h1>
  <div class="sub">spec #21 / ADR-0001 · 数据 = <b>impeccable</b> 真实历史(60 个时间点 · 20 个落 tag)· 刻度按<b>提交日期比例</b>定位 · 纯静态可直开</div>
  <div class="board">
    <div id="tl"></div>
    <div class="readout" id="readout"></div>
    <div class="legend">
      <span>拖动<span style="color:var(--blue)">双柄</span>选时间点(自动锚定最近 commit)</span>
      <span>点击刻度直达</span><span class="o">橙点/标签 = 上游 tag</span>
      <span>滚轮缩放 · 空白拖动平移</span>
    </div>
  </div>
</div>
